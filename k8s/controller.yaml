apiVersion: v1
kind: ServiceAccount
metadata:
  name: gari-controller
  namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gari-dataplane
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gari-controller
rules:
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes", "gateways", "gatewayclasses", "backendtlspolicies", "referencegrants", "listenersets"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["configmaps", "secrets", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways/status", "gatewayclasses/status", "httproutes/status", "backendtlspolicies/status", "listenersets/status"]
  verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gari-dataplane
rules:
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes", "gateways", "gatewayclasses", "backendtlspolicies", "referencegrants", "listenersets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["services", "configmaps", "secrets", "namespaces", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gari-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gari-controller
subjects:
- kind: ServiceAccount
  name: gari-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gari-dataplane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gari-dataplane
subjects:
- kind: ServiceAccount
  name: gari-dataplane
  namespace: default
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: reference-class
spec:
  controllerName: github.com/gke-labs/gateway-api-reference-implementation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gari-controller
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gari-controller
  template:
    metadata:
      labels:
        app: gari-controller
    spec:
      serviceAccountName: gari-controller
      containers:
      - name: controller
        image: gari-controller:latest
        args: ["--controller-namespace", "default"]
